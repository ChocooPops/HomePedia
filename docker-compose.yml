services:
  mariadb:
    image: mariadb:11.4
    container_name: homepedia-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-homepedia}
      MARIADB_USER: ${DB_USER:-homepedia}
      MARIADB_PASSWORD: ${DB_PASSWORD:-homepedia}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=512M
    ports:
      - "${DB_HOST_PORT:-3310}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.0
    container_name: homepedia-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-homepedia}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-homepedia}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: homepedia-api
    profiles: ["full"]
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      MONGO_URI: mongodb://${MONGO_USER:-homepedia}:${MONGO_PASSWORD:-homepedia}@mongodb:27017/homepedia?authSource=admin
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: homepedia-frontend
    profiles: ["full"]
    restart: unless-stopped
    environment:
      HOMEPEDIA_API_URL: http://api:8000/api
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "${FRONT_PORT:-8501}:8501"
    depends_on:
      - api

volumes:
  mariadb-data:
  mongodb-data:
